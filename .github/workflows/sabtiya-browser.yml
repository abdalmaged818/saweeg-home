name: Sabtiya browser verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'assets-source/**'
      - 'content-source/saweeg-global/**'
      - 'menu/**'
      - 'scripts/**'
      - 'tests/**'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .node-version
      - tsconfig.json
      - vite.config.ts
      - .github/workflows/sabtiya-browser.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full production build and unchanged verification gate
        id: build
        continue-on-error: true
        run: pnpm run build
      - name: Install isolated browser-test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/sabtiya-browser" --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/sabtiya-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Mocked-time responsive browser checks
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/sabtiya-browser/node_modules/playwright/index.mjs
        run: node tests/sabtiya-browser.mjs
      - name: Approved visual redesign semantic and responsive verification
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/sabtiya-browser/node_modules/playwright/index.mjs
        run: node tests/visual-redesign-browser.mjs
      - name: Save visual redesign screenshots and semantic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-redesign-results
          path: test-results/visual-redesign
      - name: Isolated Saweeg Global foundation and byte-identical production output
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/sabtiya-browser/node_modules/playwright/index.mjs
        run: node tests/saweeg-global-browser.mjs
      - name: Save non-public Global test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saweeg-global-foundation-results
          path: test-results/saweeg-global
      - name: Save screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sabtiya-browser-results
          path: test-results/sabtiya
      - name: Preserve failed build status
        if: steps.build.outcome == 'failure'
        run: exit 1
