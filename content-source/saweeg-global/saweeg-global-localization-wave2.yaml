      "world.about.heading": "À la découverte de Saweeg"
      "world.about.description": "Saweeg est une marque saoudienne de Médine qui revisite le patrimoine culinaire de la ville dans un esprit contemporain. Talbinah prophétique, saweeg traditionnel et produits pour recevoir, offrir ou savourer au quotidien."
      "world.about.heritage": "Nous puisons dans les recettes de Médine, les souvenirs de ses foyers et ses traditions d’accueil. Nous renouvelons la façon de les partager pour qu’ils gardent leur place dans la vie quotidienne."
