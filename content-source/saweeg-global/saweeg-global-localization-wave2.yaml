      "world.welcome.title": "Selamat datang ke Saweeg"
      "world.welcome.description": "Kisah dari Madinah yang kami kongsikan dengan dunia. Kenali Saweeg dalam bahasa anda."
      "world.welcome.languageLabel": "Pilih bahasa anda"
      "world.hero.heading": "Dari Madinah ke seluruh dunia"
      "world.hero.description": "Warisan makanan Madinah dalam produk dan pengalaman masa kini."
      "world.hero.cta": "Kenali Saweeg"
      "world.about.heading": "Kenali Saweeg"
      "world.about.description": "Saweeg ialah jenama Arab Saudi dari Madinah yang memperkenalkan semula warisan makanan Madinah dengan sentuhan masa kini. Daripada talbinah nabawi dan saweeg kepada produk untuk menjamu tetamu, dijadikan hadiah dan dinikmati setiap hari."
      "world.about.heritage": "Kami mendapat ilham daripada resipi Madinah, kenangan di rumah-rumahnya dan tradisi menjamu tetamu. Kami memperbaharui cara penyajiannya agar terus dekat dengan kehidupan seharian."
      "world.talbinah.heading": "Apakah talbinah nabawi?"
      "world.talbinah.description": "Talbinah ialah makanan tradisional yang diperbuat daripada barli yang dikisar dan dimasak sehingga bertekstur lembut. Talbinah disebut dalam sunnah Nabi dan merupakan antara produk utama Saweeg yang disajikan dalam olahan masa kini."
      "world.talbinah.hadithIntro": "Aisyah r.a. meriwayatkan bahawa Rasulullah SAW bersabda:"
      "world.talbinah.hadithText": "«التَّلْبِينَةُ مَجَمَّةٌ لِفُؤَادِ الْمَرِيضِ، تَذْهَبُ بِبَعْضِ الْحُزْنِ»."
