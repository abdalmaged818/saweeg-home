    "strings":
      "world.welcome.title": "Saweeg-এ স্বাগতম"
      "world.welcome.description": "মদিনার এক গল্প, যা আমরা ভাগ করে নিই সারা বিশ্বের সঙ্গে। আপনার ভাষায় Saweeg-কে জানুন।"
      "world.welcome.languageLabel": "আপনার ভাষা বেছে নিন"
      "world.hero.heading": "মদিনা থেকে বিশ্বজুড়ে"
      "world.hero.description": "মদিনার খাদ্য ঐতিহ্যকে তুলে ধরি আধুনিক পণ্য ও অভিজ্ঞতার মাধ্যমে।"
      "world.hero.cta": "Saweeg-কে জানুন"
      "world.about.heading": "Saweeg পরিচিতি"
      "world.about.description": "Saweeg মদিনার একটি সৌদি ব্র্যান্ড, যা মদিনার খাদ্য ঐতিহ্যকে নতুন করে তুলে ধরে আধুনিক আঙ্গিকে। নববী তালবিনা ও সাওয়ীক থেকে শুরু করে অতিথি আপ্যায়ন, উপহার ও দৈনন্দিন উপভোগের জন্য রয়েছে নানা পণ্য।"
      "world.about.heritage": "মদিনার রেসিপি, ঘরোয়া স্মৃতি ও অতিথি আপ্যায়ন থেকে আমরা অনুপ্রেরণা নিই। সেগুলো পরিবেশনের ধরনে নতুনত্ব আনি, যেন এই ঐতিহ্য মানুষের দৈনন্দিন জীবনের কাছাকাছি থাকে।"
      "world.talbinah.heading": "নববী তালবিনা কী?"
      "world.talbinah.description": "তালবিনা যবের গুঁড়া দিয়ে তৈরি এক ঐতিহ্যবাহী খাবার, যা মসৃণ হওয়া পর্যন্ত রান্না করা হয়। নবীর সুন্নাহয় এর উল্লেখ রয়েছে। Saweeg-এর প্রধান পণ্যগুলোর অন্যতম তালবিনা, যা আমরা আধুনিক নানা রূপে পরিবেশন করি।"
      "world.talbinah.hadithIntro": "আয়িশা (রাদিয়াল্লাহু আনহা) থেকে বর্ণিত, আল্লাহর রাসুল ﷺ বলেছেন:"
      "world.talbinah.hadithText": "«التَّلْبِينَةُ مَجَمَّةٌ لِفُؤَادِ الْمَرِيضِ، تَذْهَبُ بِبَعْضِ الْحُزْنِ»."
      "world.talbinah.hadithTranslation": "’তালবীনা’ রুগ্ন ব্যক্তির হৃদয়ে প্রশান্তি আনে এবং শোক দুঃখ কিছুটা দূর করে।"
      "world.talbinah.hadithSource": "সহিহ বুখারি, হাদিস ৫৪১৭।"
      "world.products.heading": "আমাদের পণ্যগুলো জানুন"
      "world.products.description": "তালবিনা ও সাওয়ীক থেকে শুরু করে অতিথি আপ্যায়ন ও বাড়িতে তৈরির জন্য আধুনিক নানা অভিজ্ঞতা।"
      "world.products.hotTalbinah.name": "গরম তালবিনা"
      "world.products.coldTalbinah.name": "ঠান্ডা তালবিনা"
      "world.products.talbinahIceCream.name": "তালবিনা আইসক্রিম"
      "world.products.matchaTalbinah.name": "ম্যাচা তালবিনা"
      "world.products.talbinahPowder.name": "নববী তালবিনা পাউডার"
      "world.products.saweegPowder.name": "সাওয়ীক পাউডার"
      "world.products.alJabirahBox.name": "Al Jabirah বক্স"
      "world.products.saweegMaamoul.name": "সাওয়ীক মামুল"
      "world.branches.heading": "আমাদের শাখায় স্বাগতম"
      "world.branches.description": "মদিনায় আমাদের শাখায় আসুন। সুবিধামতো শাখা বেছে নিয়ে তার অবস্থান ও মেনু দেখুন।"
      "world.branches.maqsed.name": "Al-Maqsed শাখা"
