    "glossary":
      "brand":
        "form": "Saweeg"
        "usage_rule": "Marque officielle en alphabet latin, toujours avec une majuscule. Ne pas traduire ni confondre avec le saweeg traditionnel."
      "project":
        "form": "Saweeg Global"
        "usage_rule": "Nom officiel du projet, conservé tel quel, y compris dans les liens de navigation et le titre des réseaux sociaux."
      "madinah":
        "form": "Médine"
        "usage_rule": "Exonyme français usuel de المدينة المنورة / Madinah, employé uniformément. Préserve l’origine culturelle et géographique."
      "talbinah":
        "form": "talbinah"
        "usage_rule": "Nom culturel conservé, avec majuscule en début de nom de produit ou de rubrique. La définition explique la préparation à base d’orge moulu."
      "prophetic_talbinah":
        "form": "talbinah prophétique"
        "usage_rule": "Désignation culturelle et religieuse du mets cité dans la tradition prophétique. Aucun ajout de promesse médicale ou thérapeutique."
      "prophetic_tradition":
        "form": "tradition prophétique"
        "usage_rule": "Équivalent contextuel de السنة النبوية ; ne pas en déduire une promesse pour un produit commercial."
      "talbinah_powder":
        "form": "Poudre de talbinah prophétique"
        "usage_rule": "Produit destiné à la préparation, distinct de la talbinah servie chaude ou froide et de la poudre de saweeg. Ne pas ajouter un conditionnement en paquet ou en sachet."
      "traditional_saweeg":
        "form": "saweeg traditionnel"
        "usage_rule": "Nom de l’aliment en minuscules dans les phrases et dans les compléments des noms de produits. Les ingrédients ne sont pas déduits du nom."
      "saweeg_powder":
        "form": "Poudre de saweeg"
        "usage_rule": "Produit indépendant ; saweeg désigne ici l’aliment. Ne pas remplacer par de la poudre de talbinah ni ajouter de conditionnement."
      "al_jabirah":
        "form": "Al Jabirah"
        "usage_rule": "Nom commercial conservé avec la graphie latine approuvée. Aucun ingrédient ni format supplémentaire n’est présumé."
      "al_jabirah_box":
        "form": "Coffret Al Jabirah"
        "usage_rule": "Ensemble commercial approuvé. Ne pas reprendre la mention « sachets » du menu : elle ajoute une précision absente du maître arabe."
      "saweeg_maamoul":
        "form": "Maamoul au saweeg"
        "usage_rule": "Nom du produit : saweeg désigne l’aliment. Ne pas transformer en boîte de maamoul ni ajouter de garniture ou de composition."
      "madinah_food_heritage":
        "form": "patrimoine culinaire de Médine"
        "usage_rule": "Recettes, mémoire des foyers et traditions d’accueil liées à Médine ; ne se limite pas à un produit."
      "saudi_food_heritage":
        "form": "patrimoine culinaire saoudien"
        "usage_rule": "Cadre culturel plus large, sans affirmer que tous les produits sont propres à l’Arabie saoudite."
      "branch":
        "form": "succursale"
        "usage_rule": "Lieu physique que l’on peut visiter. Terme aligné sur la dénomination officielle française « Succursale Al Haram » ; distinct de la boutique en ligne."
      "menu":
        "form": "menu"
        "usage_rule": "Liste de produits et de prix propre à une succursale. Dans les commandes de navigation, menu désigne aussi le panneau de navigation selon son contexte."
      "online_store":
        "form": "boutique en ligne"
        "usage_rule": "Destination officielle pour commander. N’implique aucune livraison mondiale ; les possibilités disponibles restent à consulter."
      "maqsed_branch":
        "form": "Succursale Al-Maqsed"
        "usage_rule": "Nom de la succursale, fondé sur l’identité approuvée Al-Maqsed. Ne pas modifier la graphie du nom propre."
      "maqsed_place":
        "form": "Al-Maqsed Quba"
        "usage_rule": "Nom du lieu conservé. La mosquée de Quba est un repère distinct, situé à côté selon le maître arabe."
      "bustan_branch":
        "form": "Succursale Bustan Al-Mustazal"
        "usage_rule": "Nom de la succursale, distinct du lieu qui l’abrite ; graphie latine approuvée conservée."
      "bustan_place":
        "form": "Bustan Al-Mustazal"
        "usage_rule": "Nom du lieu conservé sans traduction littérale ni modification de graphie."
      "haram_branch":
        "form": "Succursale Al Haram"
        "usage_rule": "Nom de la succursale, identique à celui du menu officiel français. Ne pas ajouter de description non approuvée."
      "haram_place":
        "form": "Al Haram"
        "usage_rule": "Identité du lieu conservée dans le nom de la succursale et dans son texte alternatif."
      "bab_al_salam_314":
        "form": "Bab Al Salam 314"
        "usage_rule": "Description d’emplacement approuvée. Le nombre 314 reste inchangé ; ne pas ajouter « porte n° 314 » ni l’interpréter comme un numéro de porte de la mosquée."
      "hot_talbinah":
        "form": "Talbinah chaude"
        "usage_rule": "Température de service, non caractère épicé. Identique au menu officiel français."
      "cold_talbinah":
        "form": "Talbinah froide"
        "usage_rule": "Produit prêt à servir froid, distinct de la poudre à préparer. Identique au menu officiel français."
      "talbinah_ice_cream":
        "form": "Glace à la talbinah"
        "usage_rule": "Libellé générique du produit approuvé. Le menu distingue cornet et pot, mais aucun de ces formats n’est ajouté au nom générique."
      "matcha_talbinah":
        "form": "Matcha à la talbinah"
        "usage_rule": "Identité combinant matcha et talbinah. Libellé identique à celui du menu officiel français, sans réduire le produit au matcha seul."
