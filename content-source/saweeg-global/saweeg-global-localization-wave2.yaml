      "world.hero.cta": "Узнать о Saweeg"
      "world.about.heading": "О Saweeg"
      "world.about.description": "Saweeg — саудовский бренд из Медины, который по-новому представляет кулинарное наследие города. В нашем ассортименте — тальбина Пророка, традиционный савик и продукты для угощения гостей, подарков и на каждый день."
      "world.about.heritage": "Мы черпаем вдохновение в рецептах Медины, воспоминаниях о её домах и традициях гостеприимства. Мы находим новые способы подачи, чтобы это наследие оставалось частью повседневной жизни."
      "world.talbinah.heading": "Что такое тальбина Пророка?"
      "world.talbinah.description": "Тальбина — традиционное блюдо из молотого ячменя, которое варят до нежной однородной консистенции. Она упоминается в Сунне Пророка и входит в число основных продуктов Saweeg, которые мы предлагаем в современных форматах."
      "world.talbinah.hadithIntro": "Аиша, да будет доволен ею Аллах, передала, что Посланник Аллаха, да благословит его Аллах и приветствует, сказал:"
      "world.talbinah.hadithText": "«التَّلْبِينَةُ مَجَمَّةٌ لِفُؤَادِ الْمَرِيضِ، تَذْهَبُ بِبَعْضِ الْحُزْنِ»."
      "world.talbinah.hadithTranslation": "“Тальбина успокаивает сердце больного и уносит с собой часть (его) печали”"
      "world.talbinah.hadithSource": "Сахих аль-Бухари, хадис № 5417."
