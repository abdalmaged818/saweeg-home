      "world.branches.maqsed.hours": "বিকেল ৪:৩০টা–রাত ১২টা। বৃহস্পতি ও শুক্রবার রাত ২টা পর্যন্ত।"
      "world.branches.bustan.name": "Bustan Al-Mustazal শাখা"
